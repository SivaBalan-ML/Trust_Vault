services:
  postgres:
    image: postgres:16-alpine
    container_name: trustvault-postgres
    environment:
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: trustvault_dev
      POSTGRES_DB: trustvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault -d trustvault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: